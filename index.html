<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桃源弈</title>
<meta name="description" content="桃源弈：在桃花源里慢慢下一盘棋。五子棋、跳棋、象棋、斗兽棋、围棋、军棋、黑白棋、飞行棋、华容道。">
<meta name="theme-color" content="#fbf1f0">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fbf1f0;--ink:#8a4a5c;--soft:#b98593;--line:#e6c3ca}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:44px 16px 40px;overflow-x:hidden;
  background:var(--bg);color:var(--ink);font-family:'Noto Serif SC','Songti SC',serif;

#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.title{font-size:36px;font-weight:300;letter-spacing:16px;text-indent:16px;line-height:1.2;text-align:center;position:relative}
.sub{font-size:13px;letter-spacing:3px;color:var(--soft);margin:12px 0 30px;text-align:center;position:relative}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,240px));gap:18px;position:relative}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,260px))}}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}a.card{padding:8px 8px 12px}.name{font-size:17px;letter-spacing:5px;text-indent:5px;margin-top:8px}.tag{font-size:11px;letter-spacing:1px}}

canvas{display:block;width:100%;height:auto;border-radius:2px}
.name{font-size:20px;font-weight:400;letter-spacing:8px;text-indent:8px;text-align:center;margin-top:12px}
.tag{font-size:12px;letter-spacing:4px;color:var(--soft);text-align:center;margin-top:4px}
.footer{margin-top:40px;font-size:11px;letter-spacing:4px;color:var(--line);position:relative}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="title">桃 源 弈</div>
<div class="sub">一 册 棋 ， 慢 慢 下</div>
<div class="grid">

  <a class="card" href="tiaoqi.html"><canvas data-g="tiao" width="560" height="360"></canvas><div class="name">跳棋</div><div class="tag">跳过一座座小桥</div></a>
  <a class="card" href="xiangqi.html"><canvas data-g="xiang" width="560" height="360"></canvas><div class="name">象棋</div><div class="tag">楚河汉界，一局春秋</div></a>

</div>
<div class="footer">落 · 桃 · 成 · 诗</div>
<script>
let ctx;
function blob(x,y,r,col,a){const b=ctx.createRadialGradient(x,y,0,x,y,r);b.addColorStop(0,col.replace('A',a));b.addColorStop(1,col.replace('A',0));ctx.fillStyle=b;ctx.fillRect(x-r,y-r,r*2,r*2)}
// 珍珠（和五子棋同一画法）；tint 用来给跳棋上色
function pearl(x,y,R,p,tint){const t=p===1?'70,25,45':'150,110,130';
  const sg=ctx.createRadialGradient(x+R*.18,y+R*.26,R*.3,x+R*.18,y+R*.26,R*1.25);sg.addColorStop(0,`rgba(${t},.3)`);sg.addColorStop(1,`rgba(${t},0)`);ctx.fillStyle=sg;ctx.beginPath();ctx.arc(x+R*.18,y+R*.26,R*1.25,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.clip();const b=ctx.createRadialGradient(x-R*.35,y-R*.4,R*.1,x,y,R*1.05);
  if(p===1){b.addColorStop(0,'#6d4a63');b.addColorStop(.45,'#3e2235');b.addColorStop(1,'#1c0c17')}
  else if(tint){b.addColorStop(0,'#fffdfb');b.addColorStop(.5,tint[0]);b.addColorStop(1,tint[1])}
  else{b.addColorStop(0,'#fffdfb');b.addColorStop(.5,'#f6eeee');b.addColorStop(.85,'#e6d9df');b.addColorStop(1,'#d3c4cf')}
  ctx.fillStyle=b;ctx.fillRect(x-R,y-R,R*2,R*2);ctx.globalCompositeOperation=p===1?'screen':'soft-light';const k=p===1?1:1.6;
  blob(x+R*.35,y-R*.15,R*.75,'rgba(120,200,190,A)',.22*k);blob(x-R*.4,y+R*.35,R*.8,'rgba(230,140,190,A)',.25*k);ctx.globalCompositeOperation='source-over';
  blob(x-R*.32,y-R*.38,R*.55,'rgba(255,255,255,A)',p===1?.35:.75);blob(x-R*.36,y-R*.42,R*.13,'rgba(255,255,255,A)',p===1?.85:1);ctx.restore()}
function petal(x,y,s,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,y+s);ctx.bezierCurveTo(x-s,y+s*.25,x-s*.7,y-s*.85,x,y-s);ctx.bezierCurveTo(x+s*.7,y-s*.85,x+s,y+s*.25,x,y+s);ctx.fill()}
function flower(x,y,s){ctx.save();ctx.translate(x,y);
  for(let k=0;k<5;k++){ctx.save();ctx.rotate(k*Math.PI*2/5);const g=ctx.createRadialGradient(0,0,s*.1,0,0,s*1.7);g.addColorStop(0,'#d9577f');g.addColorStop(.3,'#f08aa8');g.addColorStop(1,'#f9bccb');petal(0,-s*.9,s*.78,g);ctx.restore()}
  ctx.strokeStyle='#c94d74';ctx.lineWidth=s*.08;ctx.fillStyle='#f5cf6a';for(let k=0;k<9;k++){const a=k*Math.PI*2/9+.2,l=s*(.42+.12*(k%2));ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*l,Math.sin(a)*l);ctx.stroke();ctx.beginPath();ctx.arc(Math.cos(a)*l,Math.sin(a)*l,s*.07,0,7);ctx.fill()}
  ctx.restore()}
const LINE='rgba(170,100,120,.42)';
function grid(x0,y0,cols,rows,c){ctx.strokeStyle=LINE;ctx.lineWidth=1.6;for(let i=0;i<cols;i++){ctx.beginPath();ctx.moveTo(x0+i*c,y0);ctx.lineTo(x0+i*c,y0+(rows-1)*c);ctx.stroke()}for(let j=0;j<rows;j++){ctx.beginPath();ctx.moveTo(x0,y0+j*c);ctx.lineTo(x0+(cols-1)*c,y0+j*c);ctx.stroke()}}
function disc(x,y,R,p,ch,red){pearl(x,y,R,p);ctx.strokeStyle=p===1?'rgba(255,215,230,.45)':'rgba(170,100,120,.35)';ctx.lineWidth=R*.06;ctx.beginPath();ctx.arc(x,y,R*.8,0,7);ctx.stroke();
  ctx.fillStyle=red?'#b8324f':(p===1?'#f6e6ec':'#4a2a3a');ctx.font=`600 ${ch.length>1?R*.62:R*1.0}px 'Noto Serif SC',serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,x,y+R*.04)}
const DRAW={
  wu(W,H){const c=44,x0=W/2-c*5,y0=H/2-c*3;grid(x0,y0,11,7,c);
    [[1,3,1],[2,4,1],[3,5,1],[4,6,1],[5,7,1],[1,6,2],[2,8,2],[3,3,2],[4,4,2],[5,5,2]].forEach(([r,cc,p])=>pearl(x0+cc*c,y0+r*c,c*.42,p));
    ctx.strokeStyle='rgba(214,110,138,.8)';ctx.lineWidth=2.5;ctx.beginPath();for(let i=0;i<=40;i++){const k=i/40,x=x0+c*3+c*4*k,y=y0+c+c*4*k,w=Math.sin(k*Math.PI*4)*4;ctx.lineTo(x-w*.7,y+w*.7)}ctx.stroke();
    flower(x0+c*2,y0+c*5,8);flower(x0+c*8,y0+c*1,8)},
  tiao(W,H){const s=34,cx=W/2,top=40,cols=[['#f0b6c4','#d6889c'],['#eac874','#c9a35a'],['#b3cdac','#86a37c'],['#aed2d7','#7ea9b0']];
    const pts=[];for(let r=0;r<8;r++)for(let i=0;i<=r;i++)pts.push([cx+(i-r/2)*s*1.15,top+r*s]);
    ctx.fillStyle='rgba(170,100,120,.35)';pts.forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,3.2,0,7);ctx.fill()});
    pts.forEach(([x,y],i)=>{if(i<6)pearl(x,y,14,2,cols[0]);else if(i>=28&&i<31)pearl(x,y,14,2,cols[2]);else if(i>=33&&i<36)pearl(x,y,14,2,cols[3])});
    pearl(pts[13][0],pts[13][1],14,2,cols[1]);
    ctx.setLineDash([4,6]);ctx.strokeStyle='rgba(214,110,138,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pts[13][0],pts[13][1]);ctx.quadraticCurveTo(pts[13][0]+30,pts[13][1]-50,pts[4][0],pts[4][1]-6);ctx.stroke();ctx.setLineDash([]);
    flower(pts[19][0],pts[19][1],7)},
  xiang(W,H){const c=58,x0=W/2-c*4,y0=36;ctx.strokeStyle=LINE;ctx.lineWidth=1.6;
    for(let j=0;j<6;j++){if(j===2||j===3)continue}grid(x0,y0,9,3,c);grid(x0,y0+c*3,9,3,c);ctx.beginPath();ctx.moveTo(x0,y0+c*2);ctx.lineTo(x0,y0+c*3);ctx.moveTo(x0+c*8,y0+c*2);ctx.lineTo(x0+c*8,y0+c*3);ctx.stroke();
    ctx.fillStyle='rgba(170,100,120,.5)';ctx.font=`300 26px 'Noto Serif SC',serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('楚　河',x0+c*2,y0+c*2.5);ctx.fillText('汉　界',x0+c*6,y0+c*2.5);
    disc(x0+c*2,y0+c,25,1,'車');disc(x0+c*5,y0+c*1,25,1,'馬');disc(x0+c*3,y0+c*4,25,2,'炮',1);disc(x0+c*6,y0+c*4,25,2,'帥',1);disc(x0+c*4,y0+c*2,25,2,'兵',1);flower(x0+c*4,y0+c*2.5+48,7)},
  dou(W,H){const c=54,x0=W/2-c*3.5,y0=H/2-c*2.5;ctx.strokeStyle=LINE;ctx.lineWidth=1.6;for(let i=0;i<=7;i++){ctx.beginPath();ctx.moveTo(x0+i*c,y0);ctx.lineTo(x0+i*c,y0+c*5);ctx.stroke()}for(let j=0;j<=5;j++){ctx.beginPath();ctx.moveTo(x0,y0+j*c);ctx.lineTo(x0+c*7,y0+j*c);ctx.stroke()}
    [[1,1],[2,1],[4,1],[5,1]].forEach(([cx])=>{});for(const cx of[1,4])for(const cy of[1,2,3]){ctx.fillStyle='rgba(160,205,210,.32)';ctx.fillRect(x0+cx*c+1,y0+cy*c+1,c*2-2,c-2)}
    ctx.strokeStyle='rgba(110,170,180,.5)';ctx.lineWidth=1.4;for(const cx of[1,4])for(let k=0;k<5;k++){const y=y0+c*1.4+k*c*.42;ctx.beginPath();for(let i=0;i<=20;i++){const x=x0+cx*c+8+i*(c*2-16)/20;ctx.lineTo(x,y+Math.sin(i*.9+k)*2.5)}ctx.stroke()}
    disc(x0+c*1.5,y0+c*2.5,22,2,'鼠',1);disc(x0+c*3.5,y0+c*.5,22,1,'象');disc(x0+c*3.5,y0+c*4.5,22,2,'獅',1);disc(x0+c*6.5,y0+c*.5,22,1,'虎');flower(x0+c*3.5,y0+c*2.5,10);flower(x0+c*.5,y0+c*4.5,7)},
  jun(W,H){const cx=92,cy=58,x0=W/2-cx*2,y0=H/2-cy*2.5,R=22,P=(i,j)=>[x0+i*cx,y0+j*cy];
    ctx.strokeStyle=LINE;ctx.lineWidth=1.4;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(...P(i,0));ctx.lineTo(...P(i,5));ctx.stroke()}for(let j=0;j<6;j++){ctx.beginPath();ctx.moveTo(...P(0,j));ctx.lineTo(...P(4,j));ctx.stroke()}
    ctx.beginPath();ctx.moveTo(...P(1,2));ctx.lineTo(...P(3,4));ctx.moveTo(...P(3,2));ctx.lineTo(...P(1,4));ctx.stroke();
    // 铁路：粉色双线
    ctx.strokeStyle='rgba(214,110,138,.55)';ctx.lineWidth=1.2;for(const d of[-3,3]){for(const j of[1,5]){ctx.beginPath();ctx.moveTo(P(0,j)[0],P(0,j)[1]+d);ctx.lineTo(P(4,j)[0],P(4,j)[1]+d);ctx.stroke()}for(const i of[0,4]){ctx.beginPath();ctx.moveTo(P(i,1)[0]+d,P(i,1)[1]);ctx.lineTo(P(i,5)[0]+d,P(i,5)[1]);ctx.stroke()}}
    // 行营
    for(const[i,j]of[[1,2],[3,2],[2,3],[1,4],[3,4]]){const[x,y]=P(i,j);ctx.strokeStyle='rgba(170,100,120,.5)';ctx.lineWidth=1.2;ctx.fillStyle='#fffaf8';ctx.beginPath();ctx.arc(x,y,R*.9,0,7);ctx.fill();ctx.stroke();flower(x,y,6)}
    const back=(x,y)=>{pearl(x,y,R,2);ctx.save();ctx.globalAlpha=.6;flower(x,y,7);ctx.restore()};
    [[0,0],[1,0],[3,0],[4,1],[0,2],[4,2],[0,3],[4,3],[2,4],[0,5],[2,5],[4,5],[1,1],[3,5]].forEach(([i,j])=>back(...P(i,j)));
    disc(...P(2,0),R,1,'司令');disc(...P(4,0),R,2,'炸弹',1);disc(...P(2,1),R,2,'工兵',1);disc(...P(3,1),R,1,'军旗');disc(...P(1,5),R,1,'地雷')},
  hei(W,H){const c=40,x0=W/2-c*4,y0=H/2-c*4;ctx.strokeStyle=LINE;ctx.lineWidth=1.4;for(let i=0;i<=8;i++){ctx.beginPath();ctx.moveTo(x0+i*c,y0);ctx.lineTo(x0+i*c,y0+8*c);ctx.stroke();ctx.beginPath();ctx.moveTo(x0,y0+i*c);ctx.lineTo(x0+8*c,y0+i*c);ctx.stroke()}
    for(const[i,j]of[[2,2],[6,2],[2,6],[6,6]])flower(x0+i*c,y0+j*c,6);
    const C=(i,j,p)=>pearl(x0+(i+.5)*c,y0+(j+.5)*c,c*.42,p);[[3,3,2],[4,4,2],[3,4,1],[4,3,1],[5,3,1],[2,4,2],[3,5,1],[4,5,1],[5,2,2],[2,2,1]].forEach(([i,j,p])=>C(i,j,p));},
  fei(W,H){const s=26,cx=W/2-50,cy=H/2,col=[[234,150,170],[140,190,198],[146,184,136],[234,200,116]];
    const sq=(i,j,k,a=.38)=>{const c=col[k],x=cx+i*s,y=cy+j*s;ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${a})`;ctx.beginPath();ctx.roundRect(x-s*.42,y-s*.42,s*.84,s*.84,5);ctx.fill()};
    // 十字形：四条臂，每条 3 格宽、4 格长，颜色轮流
    let k=0;for(let L=2;L<=5;L++)for(let w=-1;w<=1;w++){sq(w,-L,(k++)%4);sq(L,w,(k++)%4);sq(-w,L,(k++)%4);sq(-L,-w,(k++)%4)}
    // 中间终点：四色三角 + 一朵大桃花
    for(let q=0;q<4;q++){const c=col[q];ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},.45)`;ctx.beginPath();ctx.moveTo(cx,cy);const a1=q*Math.PI/2-Math.PI*3/4,a2=a1+Math.PI/2;ctx.lineTo(cx+Math.cos(a1)*s*2.1,cy+Math.sin(a1)*s*2.1);ctx.lineTo(cx+Math.cos(a2)*s*2.1,cy+Math.sin(a2)*s*2.1);ctx.fill()}
    flower(cx,cy,13);
    // 四角机场
    [[-3.6,-3.6,0],[3.6,-3.6,1],[3.6,3.6,2],[-3.6,3.6,3]].forEach(([i,j,q])=>{const c=col[q];ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},.22)`;ctx.beginPath();ctx.roundRect(cx+i*s-s*1.2,cy+j*s-s*1.2,s*2.4,s*2.4,10);ctx.fill()});
    const jade=(i,j,q)=>{const c=col[q];pearl(cx+i*s,cy+j*s,s*.38,2,[`rgb(${c.join(',')})`,`rgb(${c.map(v=>v*.78|0).join(',')})`])};
    jade(-1,-4,0);jade(4,1,1);jade(0,3,2);jade(-3,0,3);jade(-3.9,-3.3,0);jade(3.3,3.9,2);
    // 白玉方片骰子 + 四颗粉珍珠
    const dx=W/2+178,dy=H/2,d=58;ctx.save();ctx.shadowColor='rgba(140,70,90,.2)';ctx.shadowBlur=12;ctx.shadowOffsetY=5;ctx.fillStyle='#f7f1ed';ctx.beginPath();ctx.roundRect(dx-d/2,dy-d/2,d,d,d*.22);ctx.fill();ctx.restore();
    let g=ctx.createRadialGradient(dx-d*.2,dy-d*.25,2,dx,dy,d*.8);g.addColorStop(0,'#fffefc');g.addColorStop(1,'#efe6e1');ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(dx-d/2,dy-d/2,d,d,d*.22);ctx.fill();
    for(const[a2,b2]of[[-1,-1],[1,-1],[-1,1],[1,1]])pearl(dx+a2*d*.27,dy+b2*d*.27,5.5,2,['#f4b6c6','#d77d97'])},
  hua(W,H){const c=58,x0=W/2-c*2,y0=H/2-c*2.5-6;ctx.strokeStyle='rgba(170,100,120,.5)';ctx.lineWidth=1.4;ctx.beginPath();ctx.roundRect(x0-6,y0-6,c*4+12,c*5+12,8);ctx.stroke();
    const blk=(i,j,w,h,top,bot,txt)=>{const x=x0+i*c+3,y=y0+j*c+3,ww=w*c-6,hh=h*c-6;ctx.save();ctx.shadowColor='rgba(140,70,90,.22)';ctx.shadowBlur=8;ctx.shadowOffsetY=3;
      const g=ctx.createLinearGradient(x,y,x+ww,y+hh);g.addColorStop(0,top);g.addColorStop(1,bot);ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,ww,hh,8);ctx.fill();ctx.restore();
      ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.roundRect(x+3,y+3,ww-6,hh*.35,6);ctx.fill();
      ctx.fillStyle='#8a3a52';ctx.font=`600 ${Math.min(ww,hh)*.32}px 'Noto Serif SC',serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      if(h>w&&txt.length===2){ctx.fillText(txt[0],x+ww/2,y+hh*.32);ctx.fillText(txt[1],x+ww/2,y+hh*.68)}else ctx.fillText(txt,x+ww/2,y+hh/2)};
    const wy=['#fffaf3','#ead2b4'],pk=['#f9c9d4','#e0809a'],qg=['#e2f4ee','#9ccdbb'],pw=['#ffffff','#e6d9df'];

    blk(1,3,1,1,...pw,'兵');blk(2,3,1,1,...pw,'兵');blk(0,4,1,1,...pw,'兵');blk(3,4,1,1,...pw,'兵');flower(x0+c*2,y0+c*5+12,8)},
  wei(W,H){const c=40,x0=W/2-c*4,y0=H/2-c*4;grid(x0,y0,9,9,c);
    const B=[[2,3],[2,4],[3,2],[4,2],[5,3],[4,5],[3,5],[6,6]],Wt=[[3,3],[3,4],[4,3],[5,5],[2,6],[6,4]];
    B.forEach(([r,cc])=>pearl(x0+cc*c,y0+r*c,c*.45,1));Wt.forEach(([r,cc])=>pearl(x0+cc*c,y0+r*c,c*.45,2));
    for(const[r,cc]of[[2,2],[2,6],[6,2],[6,6],[4,4]])if(!B.concat(Wt).some(p=>p[0]===r&&p[1]===cc))flower(x0+cc*c,y0+r*c,6)}
};
document.querySelectorAll('canvas[data-g]').forEach(cv=>{ctx=cv.getContext('2d');ctx.fillStyle='#fffaf8';ctx.fillRect(0,0,cv.width,cv.height);DRAW[cv.dataset.g](cv.width,cv.height)});
// 背景慢慢飘几片桃花瓣
const sky=document.getElementById('sky'),sc=sky.getContext('2d');let P=[];
function rs(){sky.width=innerWidth*devicePixelRatio;sky.height=innerHeight*devicePixelRatio}rs();addEventListener('resize',rs);
for(let i=0;i<9;i++)P.push({x:Math.random(),y:Math.random(),s:5+Math.random()*4,v:.00025+Math.random()*.0003,r:Math.random()*6,w:Math.random()*6,c:['#f6a5bb','#f18fab','#fbc4d2','#f7b3c5'][i%4]});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(){sc.clearRect(0,0,sky.width,sky.height);const d=devicePixelRatio;
  for(const p of P){if(!reduce){p.y+=p.v;p.w+=.01;p.r+=.008;if(p.y>1.05){p.y=-.05;p.x=Math.random()}}
    const x=(p.x+Math.sin(p.w)*.02)*sky.width,y=p.y*sky.height;sc.save();sc.translate(x,y);sc.rotate(p.r);sc.globalAlpha=.55;sc.fillStyle=p.c;const s=p.s*d;
    sc.beginPath();sc.moveTo(0,s);sc.bezierCurveTo(-s,s*.25,-s*.7,-s*.85,0,-s);sc.bezierCurveTo(s*.7,-s*.85,s,s*.25,0,s);sc.fill();sc.restore()}
  if(!reduce)requestAnimationFrame(tick)}
tick();
</script>
